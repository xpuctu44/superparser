<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main>
    <h1>Вход</h1>
    <form method="post" action="/auth/login" class="stack">
      <label>Email или логин <input type="text" name="identifier" required /></label>
      <label>Пароль <input type="password" name="password" required /></label>
      <div class="actions"><button type="submit">Войти</button></div>
    </form>
    <p>Нет аккаунта? <a href="/auth/signup">Регистрация</a></p>
  </main>
</body>
</html>
