<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <div class="card" style="max-width:560px;margin:0 auto;">
      <h1>Регистрация</h1>
      <form method="post" action="/auth/signup" class="stack">
        <label>Email <input type="email" name="email" required /></label>
        <label>Логин <input type="text" name="username" placeholder="ваше имя/логин" /></label>
        <label>Телефон <input type="tel" name="phone" placeholder="+7..." /></label>
        <label>Компания
          <select name="company_id" required>
            {% for c in companies %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Пароль <input type="password" name="password" required /></label>
        <div class="actions"><button type="submit">Создать аккаунт</button></div>
      </form>
      <p>Уже есть аккаунт? <a href="/auth/login">Войти</a></p>
    </div>
  </main>
</body>
</html>
